name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include real credentials or private database data.
  - type: input
    id: version
    attributes:
      label: Procora version
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options: [SQL Server, PostgreSQL, MySQL, Custom backend, Core API]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and traceback
    validations:
      required: true

